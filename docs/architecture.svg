<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <rect width="900" height="440" fill="#f6f8fa" rx="8"/>
  <text x="28" y="38" font-size="17" font-weight="600" fill="#1f2328">Aria — how a plain-English question becomes an answer</text>
  <text x="28" y="58" font-size="12.5" fill="#656d76">Generated SQL never reaches the database on a writable connection.</text>

  <rect x="28" y="96" width="170" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="113" y="118" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Next.js chat</text>
  <text x="113" y="134" font-size="10.5" fill="#57606a" text-anchor="middle">"how many leads this week?"</text>

  <rect x="248" y="96" width="170" height="50" rx="6" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="333" y="118" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Go API</text>
  <text x="333" y="134" font-size="10.5" fill="#57606a" text-anchor="middle">auth, handlers, SSE</text>

  <rect x="468" y="96" width="170" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="553" y="118" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">AI query service</text>
  <text x="553" y="134" font-size="10.5" fill="#57606a" text-anchor="middle">prompt + schema context</text>

  <rect x="688" y="96" width="170" height="50" rx="6" fill="#1f2328" stroke="#1f2328"/>
  <text x="773" y="118" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">LLM</text>
  <text x="773" y="134" font-size="10.5" fill="#b1bac4" text-anchor="middle">generates SQL</text>

  <line x1="198" y1="121" x2="242" y2="121" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="418" y1="121" x2="462" y2="121" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="638" y1="121" x2="682" y2="121" stroke="#6e7781" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="468" y="186" width="170" height="46" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="553" y="206" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">schema pipeline</text>
  <text x="553" y="221" font-size="10.5" fill="#57606a" text-anchor="middle">tables, columns, intents</text>
  <line x1="553" y1="186" x2="553" y2="152" stroke="#8c959f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a)"/>

  <rect x="688" y="186" width="170" height="50" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="773" y="208" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">read-only executor</text>
  <text x="773" y="224" font-size="10.5" fill="#1a7f37" text-anchor="middle">writes rejected by construction</text>
  <line x1="773" y1="146" x2="773" y2="182" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ag)"/>

  <rect x="468" y="276" width="170" height="50" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="553" y="298" font-size="12.5" font-weight="600" fill="#1f2328" text-anchor="middle">PostgreSQL + pgvector</text>
  <text x="553" y="314" font-size="10.5" fill="#57606a" text-anchor="middle">leads, bookings, tasks, partners</text>

  <path d="M773,236 L773,301 L646,301" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#ag)"/>

  <path d="M553,326 L553,378 L113,378 L113,152" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="333" y="366" font-size="11" fill="#656d76" text-anchor="middle">rows → answer, streamed back over SSE</text>

  <text x="28" y="412" font-size="11.5" fill="#656d76">The model only ever sees schema metadata, and the connection it runs against has no write grant —</text>
  <text x="28" y="429" font-size="11.5" fill="#656d76">so a bad generation returns an error, not a mutation.</text>
</svg>
